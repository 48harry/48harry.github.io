<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The wordmark's ␣ (an editor's visible space) in the accent, on a sheet of paper; the sheet goes
       dark with the browser. custom.js redraws this for an accent picked in 보기 설정: keep them alike.
       The ␣ sits on whole pixels at 16 and 32px. -->
  <style>
    .paper { fill: #FFFFFF; }
    .edge { fill: none; stroke: #000000; stroke-opacity: .1; }
    .space { fill: #0071E3; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #1C1C1E; }
      .edge { stroke: #FFFFFF; stroke-opacity: .14; }
      .space { fill: #4F93EC; }
    }
  </style>
  <rect class="paper" width="32" height="32" rx="7"/>
  <rect class="edge" x=".5" y=".5" width="31" height="31" rx="6.5"/>
  <path class="space" d="M6 10h4v8h12v-8h4v12H6z"/>
</svg>
