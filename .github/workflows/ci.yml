name: Jekyll build check

# Pages deploys from main via the legacy builder; this only verifies the site
# builds with the same toolchain so broken front matter is caught on push.
on: [push, pull_request]

jobs:
  build:
    name: Build Jekyll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with GitHub Pages builder
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
