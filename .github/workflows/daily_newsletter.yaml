name: Daily Tech Blog Auto Post

on:
  schedule:
    # GitHub 예약 실행은 정각(특히 UTC 00:00)에 몇 시간씩 밀리거나 빠지기도 해서, 정각을 피한 여러 시각에 건다.
    # 오늘 글이 이미 있으면 스크립트가 바로 건너뛰고, concurrency가 실행을 한 줄로 세워 중복 생성도 없음.
    # 글 시각은 스크립트가 09:00으로 고정함. (KST 09:07 / 10:37 / 12:07 / 14:37 / 18:07)
    - cron: '7 0 * * *'
    - cron: '37 1 * * *'
    - cron: '7 3 * * *'
    - cron: '37 5 * * *'
    - cron: '7 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '포스트를 커밋하지 않고 로그로만 출력'
        type: boolean
        default: false
      force:
        description: '오늘 글이 이미 있어도 새로 생성해서 덮어쓰기'
        type: boolean
        default: false

concurrency:
  group: daily-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: Generate Blog Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: python scripts/daily_newsletter.py

      - name: Commit and Push new post to _posts
        if: ${{ !inputs.dry_run }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add _posts/
          if git diff --staged --quiet; then
            echo "변경된 포스트가 없습니다."
          else
            git commit -m "🤖 chore: daily hacker news update (${{ github.run_number }})"
            git pull --rebase origin main
            git push
          fi
