{% if site.post_search %}

<div id="beautifuljekyll-search-overlay" role="dialog" aria-modal="true" aria-label="검색">
  <div class="search-panel">
    <div class="search-bar">
      {% include icon.html name="magnifying-glass" class="search-bar-icon" %}
      <input type="text" id="nav-search-input" placeholder="글 제목, 내용, 태그로 검색" aria-label="검색어" autocomplete="off" spellcheck="false">
      <button type="button" id="nav-search-exit" title="닫기 (Esc)" aria-label="검색 닫기"><kbd>ESC</kbd></button>
    </div>
    <ul id="search-results-container"></ul>
    <p class="search-hint search-hint-empty">찾고 싶은 글의 키워드를 입력하세요</p>
    <div class="search-footer" aria-hidden="true">
      <span><kbd>↑</kbd><kbd>↓</kbd> 이동</span>
      <span><kbd>Enter</kbd> 열기</span>
      <span><kbd>Ctrl</kbd><kbd>K</kbd> 검색 열기</span>
    </div>
  </div>

  <script src="https://unpkg.com/simple-jekyll-search@1.10.0/dest/simple-jekyll-search.min.js"></script>
  <script>
    SimpleJekyllSearch({
      searchInput: document.getElementById('nav-search-input'),
      resultsContainer: document.getElementById('search-results-container'),
      json: '{{ site.baseurl }}/assets/data/searchcorpus.json',
      searchResultTemplate: '<li><a class="search-result" href="{url}"><span class="search-result-title">{title}</span><span class="search-result-sub">{sub}</span><span class="search-result-meta">{date}<span class="search-result-cat">{category}</span></span></a></li>',
      noResultsText: '<li class="search-no-results">검색 결과가 없어요</li>',
      // An empty field (a page has no section or subtitle) prints nothing instead of its placeholder.
      // In titles, the words searched for are marked; the title is already HTML-escaped, so entities
      // (&amp;) are stepped over and the words are escaped the same way before matching.
      templateMiddleware: function (prop, value) {
        if (value === "") return "";
        if (prop !== "title") return undefined;
        var words = document.getElementById('nav-search-input').value.trim().split(/\s+/).filter(Boolean);
        if (!words.length) return undefined;
        var esc = function (s) {
          return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        };
        var re = new RegExp("(" + words.map(esc).join("|") + ")", "gi");
        return value.split(/(&#?\w+;)/).map(function (part, i) {
          return i % 2 ? part : part.replace(re, "<mark>$1</mark>");
        }).join("");
      },
      limit: 12
    });
  </script>
</div>

{% endif %}
