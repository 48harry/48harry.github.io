{% if site.giscus.repository and site.giscus.hostname %}

<section class="comments-section" id="comments">
  <h2 class="comments-title"><i class="far fa-comments" aria-hidden="true"></i> 댓글</h2>
  <div class="giscus"></div>
</section>

<script>
  (function () {
    // Built in JS so the widget starts in the site's current light/dark theme
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    var s = document.createElement("script");
    s.src = "https://{{ site.giscus.hostname }}/client.js";
    s.setAttribute("data-repo", "{{ site.giscus.repository }}");
    s.setAttribute("data-repo-id", "{{ site.giscus.repository-id }}");
    s.setAttribute("data-category", "{{ site.giscus.category }}");
    s.setAttribute("data-category-id", "{{ site.giscus.category-id }}");
    s.setAttribute("data-mapping", "{{ site.giscus.mapping }}");
    s.setAttribute("data-reactions-enabled", "{{ site.giscus.reactions-enabled }}");
    s.setAttribute("data-emit-metadata", "{{ site.giscus.emit-metadata }}");
    s.setAttribute("data-input-position", "top");
    s.setAttribute("data-lang", "ko");
    s.setAttribute("data-loading", "lazy");
    s.setAttribute("data-theme", dark ? "dark" : "{{ site.giscus.theme | default: 'light' }}");
    s.crossOrigin = "anonymous";
    s.async = true;
    document.currentScript.parentNode.insertBefore(s, document.currentScript);
  })();
</script>

{% endif %}
